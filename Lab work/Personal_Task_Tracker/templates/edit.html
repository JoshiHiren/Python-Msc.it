
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Task</title>
    <link rel="stylesheet"
          href="{{ url_for('static', path='/style.css') }}">
</head>
<body class="{{ theme }}">
    <main class="container narrow">
        <section class="panel">
            <h1>Edit Task</h1>

            <form action="/update/{{ task.id }}" method="POST">
                <label for="title">Task Title</label>
                <input
                    id="title"
                    name="title"
                    type="text"
                    value="{{ task.title }}"
                    maxlength="150"
                    required
                >

                <label for="description">Description</label>
                <textarea
                    id="description"
                    name="description"
                    maxlength="300"
                >{{ task.description or "" }}</textarea>

                <label for="priority">Priority</label>
                <select id="priority" name="priority" required>
                    <option value="High"
                        {% if task.priority == "High" %}selected{% endif %}>
                        High
                    </option>
                    <option value="Medium"
                        {% if task.priority == "Medium" %}selected{% endif %}>
                        Medium
                    </option>
                    <option value="Low"
                        {% if task.priority == "Low" %}selected{% endif %}>
                        Low
                    </option>
                </select>

                <div class="form-actions">
                    <button type="submit">Save Changes</button>
                    <a class="button pending" href="/">Cancel</a>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
