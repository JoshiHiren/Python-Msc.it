
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Personal Task Tracker</title>
    <link rel="stylesheet"
          href="{{ url_for('static', path='/style.css') }}">
</head>
<body class="{{ theme }}">
    <main class="login-container">
        <section class="panel">
            <h1>Personal Task Tracker</h1>
            <p>Log in with your name to manage your daily tasks.</p>

            <form action="/login" method="POST">
                <label for="username">Your Name</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    maxlength="100"
                    placeholder="Enter your name"
                    required
                    autofocus
                >
                <button type="submit">Log In</button>
            </form>

            <div class="theme-links">
                <a href="/set-theme/light">Light theme</a>
                <a href="/set-theme/dark">Dark theme</a>
            </div>
        </section>
    </main>
</body>
</html>
