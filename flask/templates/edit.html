<!DOCTYPE html>
<html>
<head>
    <title>Edit Task</title>
    <style>
        body {
            font-family: Arial;
            background: #f3f4f6;
        }
        .container {
            width: 450px;
            margin: 80px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 15px #ccc;
        }
        h1 {
            text-align: center;
            margin-bottom: 25px;
        }
        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input,
        select {
            width: 100%;
            padding: 10px;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }
        .back {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #555;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Edit Task</h1>
    <form
        action="/edit/{{ todo.id }}"
        method="POST">
        <label>Task Name</label>
        <input
            type="text"
            name="task_name"
            value="{{ todo.name }}"
            required>
        <label>Task Date</label>
        <input
            type="date"
            name="task_date"
            value="{{ todo.due_date }}"
            required>
        <label>Task Status</label>
        <select
            name="task_status"
            required>
            <option
                value="Pending"
                {% if todo.status == "Pending" %}selected{% endif %}>
                Pending
            </option>
            <option
                value="In Progress"
                {% if todo.status == "In Progress" %}selected{% endif %}>
                In Progress
            </option>
            <option
                value="Completed"
                {% if todo.status == "Completed" %}selected{% endif %}>
                Completed
            </option>
        </select>
        <button type="submit">
            Update Task
        </button>
    </form>
    <a
        href="/"
        class="back" >
        ← Back to Todo List
    </a>
</div>
</body>
</html>
