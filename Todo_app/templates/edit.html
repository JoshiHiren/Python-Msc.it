
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Task</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <section class="panel">
            <h1>Edit Task</h1>

            <form action="{{ url_for('update', id=task.id) }}"
                  method="POST">

                <label for="title">Task Title</label>
                <input type="text" id="title" name="title"
                       value="{{ task.title }}"
                       maxlength="150" required>

                <label for="description">Description</label>
                <textarea id="description" name="description"
                          maxlength="300">{{ task.description or "" }}</textarea>

                <label for="priority">Priority</label>
                <select id="priority" name="priority" required>
                    <option value="High"
                        {% if task.priority == 'High' %}selected{% endif %}>
                        High
                    </option>
                    <option value="Medium"
                        {% if task.priority == 'Medium' %}selected{% endif %}>
                        Medium
                    </option>
                    <option value="Low"
                        {% if task.priority == 'Low' %}selected{% endif %}>
                        Low
                    </option>
                </select>

                <label for="due_date">Due Date</label>
                <input type="date" id="due_date" name="due_date"
                       value="{{ task.due_date.isoformat()
                                if task.due_date else '' }}">

                <div class="form-actions">
                    <button type="submit">Save Changes</button>
                    <a class="button pending"
                       href="{{ url_for('index') }}">Cancel</a>
                </div>
            </form>
        </section>
    </div>
</body>
</html>
